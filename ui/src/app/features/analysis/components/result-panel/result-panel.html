<div class="panel">

  <h2>Results Preview</h2>

  <div class="card">
    <span class="label">Detected Language</span>
    <h3>
      {{result?.language}}
    </h3>
  </div>

  <div class="card">
    <span class="label">Confidence</span>
    <h3>
      {{result?.confidence}}%
    </h3>

    <div class="progress">
      <div 
      class="progress-fill"
      [style.width.%]="result?.confidence">
      </div>
    </div>
  </div>

  <div class="card">

  <span class="label">
    Language Breakdown
  </span>


  @for (item of breakdown; track item.name) {

    <div class="row">

      <div class="language">

        <span 
          class="language-dot"
          [style.background]="item.color">
        </span>

        <span>
          {{item.name}}
        </span>

      </div>


      <span>
        {{item.percentage}}%
      </span>

    </div>

  }

</div>

  <div class="card">
    <span class="label">AI Feedback</span>

    <p>
      {{result?.explanation}}
    </p>
  </div>

</div>
