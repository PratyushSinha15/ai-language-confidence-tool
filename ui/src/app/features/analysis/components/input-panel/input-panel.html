<div class="panel">

  <h1>Analyze Your Text</h1>

  <p>
    Paste text below and analyze language confidence.
  </p>

  <label>Enter Text</label>

  <textarea
    [(ngModel)]="text"
    placeholder="Enter text here..."
    rows="12">
  </textarea>

  <button (click)="analyze()">
    Analyze Text
  </button>

</div>
