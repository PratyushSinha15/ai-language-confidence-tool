<div class="panel">

  <h1>Analyze Your Text</h1>

  <p>
    Paste text below and analyze language confidence.
  </p>

  <label>Enter Text</label>

  <textarea
    [(ngModel)]="text"
    placeholder="Enter text here..."
    rows="12">
  </textarea>

  <div class = "action-buttons">
    <button class="analyze-btn" (click)="analyze()">
      Analyze Text
    </button>
    
    <button class="clear-btn"(click)="clearText()">
      Clear
    </button>
  </div>

</div>
