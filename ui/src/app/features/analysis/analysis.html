<section class="analysis-page">


  <div class="input-wrapper">

    <app-input-panel
      (analyzeText)="analyze($event)"
      (clear)="clear()">
    </app-input-panel>


  </div>



  <div class="result-wrapper">


    @if(isLoading){

      <div class="loading-overlay">

        <div class="spinner"></div>

        <span>
          Analyzing...
        </span>

      </div>

    }


    <app-result-panel
      [result]="result">
    </app-result-panel>


  </div>


</section>
